# Phase 0 workflow draft. Install as
# .github/workflows/refresh-gallery-examples.yml only after the generator and
# summarizer described in gallery-examples-phase-0-implementation.md land.
name: Refresh gallery examples

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: refresh-gallery-examples
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'vega/vega-datasets'
    runs-on: ubuntu-latest
    env:
      OUTPUT_PATH: data/gallery-examples.json
      REFRESH_BRANCH: automation/gallery-examples-refresh
      PR_TITLE: "chore: refresh gallery examples"
      ISSUE_TITLE: "Gallery examples regeneration failed"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: ">=0.5.0"

      - name: Prepare the automation branch
        shell: bash
        run: |
          git fetch origin \
            "refs/heads/$REFRESH_BRANCH:refs/remotes/origin/$REFRESH_BRANCH" || true
          git switch --force-create "$REFRESH_BRANCH" origin/main

      - name: Save the committed baseline
        shell: bash
        run: cp "$OUTPUT_PATH" "$RUNNER_TEMP/gallery-examples.before.json"

      - name: Regenerate the index
        id: generate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/generate_gallery_examples.py 2>&1 \
            | tee "$RUNNER_TEMP/gallery-refresh.log"

      - name: Open or update the failure issue
        if: steps.generate.outcome == 'failure'
        shell: bash
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issue_number="$(gh issue list \
            --state open \
            --search "\"$ISSUE_TITLE\" in:title" \
            --json number \
            --jq '.[0].number // empty')"

          {
            echo "Gallery example regeneration failed."
            echo
            echo "Workflow run: $run_url"
            echo
            echo '<details><summary>Last 120 log lines</summary>'
            echo
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/gallery-refresh.log"
            echo '```'
            echo '</details>'
          } > "$RUNNER_TEMP/gallery-refresh-issue.md"

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" \
              --body-file "$RUNNER_TEMP/gallery-refresh-issue.md"
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file "$RUNNER_TEMP/gallery-refresh-issue.md"
          fi

      - name: Detect aggregate drift
        if: steps.generate.outcome == 'success'
        id: drift
        shell: bash
        run: |
          if git diff --quiet -- "$OUTPUT_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize drift
        if: steps.generate.outcome == 'success' && steps.drift.outputs.changed == 'true'
        shell: bash
        run: |
          uv run python scripts/summarize_gallery_examples.py \
            --before "$RUNNER_TEMP/gallery-examples.before.json" \
            --after "$OUTPUT_PATH" \
            --markdown "$RUNNER_TEMP/gallery-refresh-summary.md" \
            --json "$RUNNER_TEMP/gallery-refresh-summary.json"

          {
            cat "$RUNNER_TEMP/gallery-refresh-summary.md"
            echo
            echo "Generated by [workflow run ${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > "$RUNNER_TEMP/gallery-refresh-pr.md"

      - name: Regenerate Data Package metadata
        if: steps.generate.outcome == 'success' && steps.drift.outputs.changed == 'true'
        shell: bash
        run: uv run python scripts/build_datapackage.py

      - name: Commit and push drift
        if: steps.generate.outcome == 'success' && steps.drift.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "$OUTPUT_PATH" \
            datapackage.json \
            datapackage.md \
            src/stringOverrides.ts
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "HEAD:refs/heads/$REFRESH_BRANCH"

      - name: Open or update the regeneration PR
        if: steps.generate.outcome == 'success' && steps.drift.outputs.changed == 'true'
        shell: bash
        run: |
          pr_number="$(gh pr list \
            --state open \
            --head "$REFRESH_BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --title "$PR_TITLE" \
              --body-file "$RUNNER_TEMP/gallery-refresh-pr.md"
          else
            gh pr create \
              --base main \
              --head "$REFRESH_BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$RUNNER_TEMP/gallery-refresh-pr.md"
          fi

      - name: Close a stale regeneration PR when drift disappears
        if: steps.generate.outcome == 'success' && steps.drift.outputs.changed == 'false'
        shell: bash
        run: |
          pr_number="$(gh pr list \
            --state open \
            --head "$REFRESH_BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]; then
            gh pr close "$pr_number" \
              --comment "Closing automatically because regeneration no longer differs from main."
          fi

      - name: Fail after reporting a regeneration error
        if: always() && steps.generate.outcome == 'failure'
        shell: bash
        run: exit 1
